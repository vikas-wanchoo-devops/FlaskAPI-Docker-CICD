name: Code Freeze Check

on:
  repository_dispatch:
    types: [freeze-updated]   # listens for central repo dispatch
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  check-freeze:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch freeze flag
        run: |
          curl -s -H "Authorization: Bearer ${{ secrets.PAT_TOKEN }}" \
            https://raw.githubusercontent.com/vikas-wanchoo-devops/release-freeze-control/main/code-freeze-config/freeze.json -o freeze.json

      - name: Debug freeze.json
        run: |
          echo "Contents of freeze.json:"
          cat freeze.json

      - name: Validate JSON
        run: |
          echo "Validating JSON format..."
          jq . freeze.json

      - name: Parse freeze flag
        id: freeze
        run: |
          FREEZE=$(jq -r '.freeze_active' freeze.json)
          echo "freeze=$FREEZE" >> $GITHUB_OUTPUT

      - name: Block merge if freeze active
        if: ${{ steps.freeze.outputs.freeze == 'true' }}
        run: |
          REASON=$(jq -r '.reason' freeze.json)
          echo "❌ Code freeze is active. Merging is blocked. Reason: $REASON"
          exit 1

      - name: Allow merge if freeze inactive
        if: ${{ steps.freeze.outputs.freeze == 'false' }}
        run: |
          REASON=$(jq -r '.reason' freeze.json)
          echo "✅ Code freeze is inactive. Merges are allowed. Reason: $REASON"
