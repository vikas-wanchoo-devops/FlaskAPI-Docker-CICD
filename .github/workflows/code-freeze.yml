name: Code Freeze Check

on:
  repository_dispatch:
    types: [freeze-updated]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  check-freeze:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch freeze.json from control repo (API, no cache)
        run: |
          curl -s -H "Authorization: Bearer ${{ secrets.PAT_TOKEN }}" \
            -H "Accept: application/vnd.github.v3.raw" \
            https://api.github.com/repos/vikas-wanchoo-devops/release-freeze-control/contents/code-freeze-config/freeze.json?ref=main \
            -o freeze.json

      - name: Debug freeze.json
        run: |
          echo "Contents of freeze.json:"
          cat freeze.json

      - name: Validate JSON
        run: jq . freeze.json

      - name: Parse freeze flag
        id: freeze
        run: |
          FREEZE=$(jq -r '.freeze_active' freeze.json | tr '[:upper:]' '[:lower:]')
          echo "Parsed freeze flag: $FREEZE"
          echo "freeze=$FREEZE" >> "$GITHUB_OUTPUT"

      - name: Block merge if freeze active
        if: ${{ steps.freeze.outputs.freeze == 'true' }}
        run: |
          REASON=$(jq -r '.reason' freeze.json)
          echo "❌ Code freeze is active. Merging is blocked. Reason: $REASON"
          exit 1

      - name: Allow merge if freeze inactive
        if: ${{ steps.freeze.outputs.freeze == 'false' }}
        run: |
          echo "✅ Code freeze has ended. Merges are now permitted."
